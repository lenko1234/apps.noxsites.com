<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nox Morphing System - Refined</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020202;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            height: 2000vh;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
            z-index: 1;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            box-sizing: border-box;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.65rem;
            opacity: 0.5;
        }

        .section {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
        }

        .section-content {
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            color: #10b981;
            font-weight: 900;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 0.75rem;
            margin-top: 10px;
            color: #777;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: #10b981;
            z-index: 100;
            width: 0%;
        }
    </style>
</head>

<body>

    <div class="progress-bar" id="progressBar"></div>

    <div class="ui-overlay">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <span>NOX // CORE</span>
            <span id="scrollPercent">00%</span>
        </div>
        <div>TRANSITION_LOG: <span id="morphStatus">STABLE</span></div>
    </div>

    <div class="section"></div>
    <div class="section"></div>
    <div class="section"></div>
    <div class="section"></div>
    <div class="section"></div>
    <div class="section"></div>
    <div class="section"></div>
    <div class="section"></div>

    <script>
        // --- Escena Base ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Muestreo de Texto ---
        function getTextImageData(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 300;
            canvas.height = 100;

            ctx.fillStyle = 'white';
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 150, 50);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const points = [];
            for (let y = 0; y < canvas.height; y += 1) {
                for (let x = 0; x < canvas.width; x += 1) {
                    if (imageData.data[(y * canvas.width + x) * 4] > 128) {
                        points.push({
                            x: (x - 150) * 0.4,
                            y: (50 - y) * 0.4,
                            z: 0
                        });
                    }
                }
            }
            return points;
        }

        const logoPoints = getTextImageData('NOX');

        // --- Generadores de Formas Geométricas ---
        function generateSphere(count, radius = 40) {
            const points = [];
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                points.push({
                    x: radius * Math.sin(phi) * Math.cos(theta),
                    y: radius * Math.sin(phi) * Math.sin(theta),
                    z: radius * Math.cos(phi)
                });
            }
            return points;
        }

        function generateSquare(count, size = 60) {
            const points = [];
            // 40% forman el cuadrado, 60% se dispersan
            const squareCount = Math.floor(count * 0.4);

            for (let i = 0; i < count; i++) {
                if (i < squareCount) {
                    // Partículas que forman el cuadrado central
                    const x = (Math.random() - 0.5) * size;
                    const y = (Math.random() - 0.5) * size;
                    points.push({
                        x: x,
                        y: y,
                        z: 0,
                        isSquareCore: true
                    });
                } else {
                    // Partículas dispersas que vuelan por toda la pantalla
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 80 + Math.random() * 120; // Lejos del centro
                    points.push({
                        x: Math.cos(angle) * distance,
                        y: Math.sin(angle) * distance,
                        z: (Math.random() - 0.5) * 100,
                        isSquareCore: false
                    });
                }
            }
            return points;
        }

        // Función de ruido simple (Perlin-like simplificado)
        function simpleNoise(x, y, z) {
            const n = Math.sin(x * 0.5) * Math.cos(y * 0.5) +
                Math.sin(y * 0.7) * Math.cos(z * 0.3) +
                Math.sin(z * 0.4) * Math.cos(x * 0.6);
            return n * 0.5 + 0.5; // Normalizar a 0-1
        }

        function generateMountainousPlanet(count, baseRadius = 40) {
            const points = [];
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                // Posición base en la esfera
                const x = Math.sin(phi) * Math.cos(theta);
                const y = Math.sin(phi) * Math.sin(theta);
                const z = Math.cos(phi);

                // Agregar "montañas" con ruido
                const noise = simpleNoise(x * 3, y * 3, z * 3);
                const mountainHeight = noise * 15; // Altura de las montañas
                const radius = baseRadius + mountainHeight;

                points.push({
                    x: radius * x,
                    y: radius * y,
                    z: radius * z
                });
            }
            return points;
        }

        function generateDNAHelix(count, radius = 25, height = 80, turns = 4) {
            const points = [];
            for (let i = 0; i < count; i++) {
                const t = (i / count) * turns * Math.PI * 2;
                const y = ((i / count) - 0.5) * height;
                const strand = i % 2;
                const offset = strand * Math.PI;
                points.push({
                    x: radius * Math.cos(t + offset),
                    y: y,
                    z: radius * Math.sin(t + offset)
                });
            }
            return points;
        }

        // --- Sistema de Partículas ---
        const particleCount = 7000; // Un poco más para densidad

        // Generar todas las formas
        const spherePoints = generateSphere(particleCount);
        const squarePoints = generateSquare(particleCount);
        const planetPoints = generateMountainousPlanet(particleCount);
        const dnaPoints = generateDNAHelix(particleCount);

        const geometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(particleCount * 3);
        const logoTargets = new Float32Array(particleCount * 3);
        const sphereTargets = new Float32Array(particleCount * 3);
        const squareTargets = new Float32Array(particleCount * 3);
        const planetTargets = new Float32Array(particleCount * 3);
        const dnaTargets = new Float32Array(particleCount * 3);

        const angleData = new Float32Array(particleCount);
        const radiusData = new Float32Array(particleCount);
        const yOffsetData = new Float32Array(particleCount);
        const speedData = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            radiusData[i] = 10 + Math.random() * 55;
            angleData[i] = Math.random() * Math.PI * 2;
            yOffsetData[i] = (Math.random() - 0.5) * 300;
            speedData[i] = 0.005 + Math.random() * 0.01;

            // Logo targets
            const lp = logoPoints[i % logoPoints.length];
            logoTargets[i * 3] = lp.x * 1.3 + (Math.random() - 0.5) * 0.5;
            logoTargets[i * 3 + 1] = lp.y * 1.3 + (Math.random() - 0.5) * 0.5;
            logoTargets[i * 3 + 2] = (Math.random() - 0.5) * 1.5;

            // Sphere targets
            sphereTargets[i * 3] = spherePoints[i].x;
            sphereTargets[i * 3 + 1] = spherePoints[i].y;
            sphereTargets[i * 3 + 2] = spherePoints[i].z;

            // Square targets
            squareTargets[i * 3] = squarePoints[i].x;
            squareTargets[i * 3 + 1] = squarePoints[i].y;
            squareTargets[i * 3 + 2] = squarePoints[i].z;

            // Planet targets
            planetTargets[i * 3] = planetPoints[i].x;
            planetTargets[i * 3 + 1] = planetPoints[i].y;
            planetTargets[i * 3 + 2] = planetPoints[i].z;

            // DNA targets
            dnaTargets[i * 3] = dnaPoints[i].x;
            dnaTargets[i * 3 + 1] = dnaPoints[i].y;
            dnaTargets[i * 3 + 2] = dnaPoints[i].z;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const material = new THREE.PointsMaterial({
            color: 0x10b981,
            size: 0.45,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // --- Animación y Scroll ---
        let targetScrollY = 0;
        let currentScrollY = 0;
        let time = 0;

        window.addEventListener('scroll', () => {
            targetScrollY = window.scrollY;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (window.pageYOffset / height) * 100;
            document.getElementById("progressBar").style.width = scrolled + "%";
            document.getElementById("scrollPercent").innerText = Math.round(scrolled).toString().padStart(2, '0') + "%";
        });

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            currentScrollY += (targetScrollY - currentScrollY) * 0.06;

            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            const scrollProgress = currentScrollY / maxScroll;

            // Definir rangos con transiciones de ida, hold, y vuelta al vórtice
            let currentShape = 'vortex';
            let shapeFactor = 0;

            if (scrollProgress < 0.15) {
                // Vórtice inicial (0-15%)
                currentShape = 'vortex';
                shapeFactor = 0;
            } else if (scrollProgress < 0.21) {
                // Transición a Esfera (15-21%)
                currentShape = 'sphere';
                shapeFactor = (scrollProgress - 0.15) / 0.06;
            } else if (scrollProgress < 0.27) {
                // Hold Esfera completa (21-27%)
                currentShape = 'sphere';
                shapeFactor = 1;
            } else if (scrollProgress < 0.33) {
                // Vuelta a Vórtice desde Esfera (27-33%)
                currentShape = 'sphere';
                shapeFactor = 1 - ((scrollProgress - 0.27) / 0.06);
            } else if (scrollProgress < 0.39) {
                // Transición a Cuadrado (33-39%)
                currentShape = 'square';
                shapeFactor = (scrollProgress - 0.33) / 0.06;
            } else if (scrollProgress < 0.45) {
                // Hold Cuadrado completo (39-45%)
                currentShape = 'square';
                shapeFactor = 1;
            } else if (scrollProgress < 0.51) {
                // Vuelta a Vórtice desde Cuadrado (45-51%)
                currentShape = 'square';
                shapeFactor = 1 - ((scrollProgress - 0.45) / 0.06);
            } else if (scrollProgress < 0.57) {
                // Transición a Planeta (51-57%)
                currentShape = 'planet';
                shapeFactor = (scrollProgress - 0.51) / 0.06;
            } else if (scrollProgress < 0.71) {
                // El mundo gira a nuestro alrededor estando adentro (57-71%)
                currentShape = 'planet';
                shapeFactor = 1;
            } else if (scrollProgress < 0.77) {
                // Vuelta a Vórtice desde Planeta (71-77%)
                currentShape = 'planet';
                shapeFactor = 1 - ((scrollProgress - 0.71) / 0.06);
            } else if (scrollProgress < 0.83) {
                // Transición a DNA (77-83%)
                currentShape = 'dna';
                shapeFactor = (scrollProgress - 0.77) / 0.06;
            } else if (scrollProgress < 0.89) {
                // Hold DNA completo (83-89%)
                currentShape = 'dna';
                shapeFactor = 1;
            } else if (scrollProgress < 0.93) {
                // Vuelta a Vórtice desde DNA (89-93%)
                currentShape = 'dna';
                shapeFactor = 1 - ((scrollProgress - 0.89) / 0.04);
            } else {
                // Transición final a Logo (93-100%)
                currentShape = 'logo';
                shapeFactor = (scrollProgress - 0.93) / 0.07;
            }

            shapeFactor = Math.max(0, Math.min(1, shapeFactor));
            const easedFactor = Math.pow(shapeFactor, 1.5);

            // Update status
            const statusMap = {
                'vortex': 'VORTEX_FLOW',
                'sphere': shapeFactor === 1 ? 'SPHERE_FORM' : 'MORPHING',
                'square': shapeFactor === 1 ? 'SQUARE_PLANE' : 'MORPHING',
                'planet': scrollProgress >= 0.57 && scrollProgress < 0.71 ? 'TERRAIN_REVOLUTION' : (shapeFactor === 1 ? 'PLANET_TERRAIN' : 'MORPHING'),
                'dna': shapeFactor === 1 ? 'DNA_HELIX' : 'MORPHING',
                'logo': shapeFactor > 0.8 ? 'LOGO_LOCKED' : 'LOGO_ASSEMBLY'
            };
            document.getElementById("morphStatus").innerText = statusMap[currentShape] || 'TRANSFORMING';

            const positions = geometry.attributes.position.array;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                // Posición base del vórtice
                angleData[i] += speedData[i] + (shapeFactor * 0.02);
                const r = radiusData[i] * (1 - shapeFactor * 0.5);
                const vx = Math.cos(angleData[i]) * r;
                const vz = Math.sin(angleData[i]) * r;

                const scrollOffset = (currentScrollY * 0.05) % 300;
                let vy = yOffsetData[i] + scrollOffset;
                vy = ((vy + 150) % 300) - 150;
                vy = vy * (1 - shapeFactor * 0.8);

                // Seleccionar targets según la forma actual
                let targetX, targetY, targetZ;

                switch (currentShape) {
                    case 'sphere':
                        targetX = sphereTargets[i3];
                        targetY = sphereTargets[i3 + 1];
                        targetZ = sphereTargets[i3 + 2];
                        break;
                    case 'square':
                        targetX = squareTargets[i3];
                        targetY = squareTargets[i3 + 1];
                        targetZ = squareTargets[i3 + 2];
                        break;
                    case 'planet':
                        // Rotación basal lenta (time * 0.01) + giro completo de 360 grados por scroll durante la fase de revolución (57% a 71%)
                        let pAngle = time * 0.01;
                        if (scrollProgress >= 0.57 && scrollProgress < 0.71) {
                            pAngle += ((scrollProgress - 0.57) / 0.14) * Math.PI * 2;
                        } else if (scrollProgress >= 0.71) {
                            pAngle += Math.PI * 2;
                        }
                        const pCos = Math.cos(pAngle);
                        const pSin = Math.sin(pAngle);
                        targetX = planetTargets[i3] * pCos - planetTargets[i3 + 2] * pSin;
                        targetY = planetTargets[i3 + 1];
                        targetZ = planetTargets[i3] * pSin + planetTargets[i3 + 2] * pCos;
                        break;
                    case 'dna':
                        targetX = dnaTargets[i3];
                        targetY = dnaTargets[i3 + 1];
                        targetZ = dnaTargets[i3 + 2];
                        break;
                    case 'logo':
                        targetX = logoTargets[i3];
                        targetY = logoTargets[i3 + 1];
                        targetZ = logoTargets[i3 + 2];
                        break;
                    default: // vortex
                        targetX = vx;
                        targetY = vy;
                        targetZ = vz;
                }

                // Agregar movimiento sutil durante el hold (excepto DNA)
                if (shapeFactor === 1 && currentShape !== 'dna' && currentShape !== 'vortex') {
                    if (currentShape === 'sphere') {
                        // Esfera: pulsación radial continua
                        const scale = 1 + Math.sin(time * 0.4 + i * 0.01) * 0.06;
                        targetX *= scale;
                        targetY *= scale;
                        targetZ *= scale;
                    } else if (currentShape === 'square') {
                        // Verificar si esta partícula es parte del núcleo del cuadrado o dispersa
                        const isCore = squarePoints[i].isSquareCore;

                        if (isCore) {
                            // Cuadrado central: ondulación sutil en Z
                            targetZ += Math.sin(time * 0.5 + targetX * 0.1 + targetY * 0.1) * 3;
                        } else {
                            // Partículas dispersas: solo aparecen después de que el cuadrado esté formado
                            if (scrollProgress >= 0.39) {
                                // Movimiento orbital y variación en Z
                                const orbitSpeed = 0.3 + (i % 100) * 0.002;
                                const orbitAngle = time * orbitSpeed + i;
                                const currentDist = Math.sqrt(targetX * targetX + targetY * targetY);

                                targetX = Math.cos(orbitAngle) * currentDist;
                                targetY = Math.sin(orbitAngle) * currentDist;
                                targetZ += Math.sin(time * 0.8 + i * 0.1) * 30;
                            } else {
                                // Antes de que el cuadrado esté formado, ocultar estas partículas
                                targetZ = -200; // Muy atrás, invisible
                            }
                        }
                    }
                }

                // Interpolación suave
                positions[i3] = vx * (1 - easedFactor) + targetX * easedFactor;
                positions[i3 + 1] = vy * (1 - easedFactor) + targetY * easedFactor;
                positions[i3 + 2] = vz * (1 - easedFactor) + targetZ * easedFactor;
            }

            geometry.attributes.position.needsUpdate = true;

            // Cámara - ajuste según la forma con viaje especial para DNA
            if (currentShape === 'dna') {
                // Durante DNA, hacemos un viaje vertical a lo largo de la espiral
                // Calculamos el progreso dentro de la fase DNA completa (77-93%)
                const dnaPhaseProgress = (scrollProgress - 0.77) / 0.16; // 0 a 1 durante toda la fase DNA

                // Zoom in al principio, luego viaje vertical
                if (dnaPhaseProgress < 0.2) {
                    // Zoom inicial a la parte superior (0-20% de la fase DNA)
                    const zoomProgress = dnaPhaseProgress / 0.2;
                    camera.position.z += (50 - camera.position.z) * 0.08;
                    camera.position.y += (35 - camera.position.y) * 0.08; // Arriba
                    camera.position.x += (0 - camera.position.x) * 0.08;
                } else if (dnaPhaseProgress < 0.8) {
                    // Viaje hacia abajo (20-80% de la fase DNA)
                    const travelProgress = (dnaPhaseProgress - 0.2) / 0.6;
                    const targetY = 35 - (travelProgress * 70); // De +35 a -35
                    camera.position.z += (50 - camera.position.z) * 0.05;
                    camera.position.y += (targetY - camera.position.y) * 0.05;
                    camera.position.x += (0 - camera.position.x) * 0.05;
                } else {
                    // Zoom out al final (80-100% de la fase DNA)
                    camera.position.z += (90 - camera.position.z) * 0.08;
                    camera.position.y += (0 - camera.position.y) * 0.08;
                    camera.position.x += (0 - camera.position.x) * 0.08;
                }
            } else if (scrollProgress > 0.93) {
                // Transición final al logo
                const targetZ = 65 + (1 - shapeFactor) * 20;
                camera.position.z += (targetZ - camera.position.z) * 0.05;
                camera.position.y += (0 - camera.position.y) * 0.05;
                camera.position.x += (0 - camera.position.x) * 0.05;
            } else if (scrollProgress > 0.15) {
                // Otras formas geométricas - vista estándar (con zoom inmersivo y alejamiento dinámico)
                let targetZ = 90;
                
                if (currentShape === 'planet') {
                    let zoomFactor = 0;
                    if (scrollProgress >= 0.51 && scrollProgress < 0.57) {
                        // Formando: viene desde 125 (lejos) y entra hasta 38 (núcleo)
                        zoomFactor = (scrollProgress - 0.51) / 0.06;
                        targetZ = 125 - (zoomFactor * 87);
                    } else if (scrollProgress >= 0.57 && scrollProgress < 0.71) {
                        // Hold y Revolución: se queda en el núcleo (38)
                        targetZ = 38;
                    } else if (scrollProgress >= 0.71 && scrollProgress < 0.77) {
                        // Desarmándose: zoom out diferido hacia 125 (lejos)
                        if (scrollProgress < 0.74) {
                            targetZ = 38; // Se queda en el núcleo inicialmente
                        } else {
                            zoomFactor = (scrollProgress - 0.74) / 0.03;
                            targetZ = 38 + (zoomFactor * 87); // Se aleja rápidamente al final
                        }
                    }
                } else if (currentShape === 'square') {
                    if (scrollProgress >= 0.45 && scrollProgress < 0.51) {
                        // Al desarmarse el cuadrado, la cámara se aleja hacia 125 para preparar la formación del planeta desde lejos
                        const factor = (scrollProgress - 0.45) / 0.06;
                        targetZ = 90 + (factor * 35);
                    }
                }
                camera.position.z += (targetZ - camera.position.z) * 0.05;
                camera.position.y += (0 - camera.position.y) * 0.05;
                camera.position.x += (0 - camera.position.x) * 0.05;
            } else {
                // Vórtice inicial - cámara dinámica
                camera.position.z = 110 + Math.sin(time * 0.3) * 15;
                camera.position.y = Math.cos(time * 0.2) * 10;
                camera.position.x = Math.sin(time * 0.4) * 15;
            }

            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
